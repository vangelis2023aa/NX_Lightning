name: Build NXLightning IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.400
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Show schemes
        run: |
          xcodebuild -list -project src/MeloNX/MeloNX.xcodeproj

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project src/MeloNX/MeloNX.xcodeproj \
            -scheme MeloNX \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/NXLightning.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r $RUNNER_TEMP/NXLightning.xcarchive/Products/Applications/*.app Payload/
          zip -r NXLightning-unsigned.ipa Payload
          mv NXLightning-unsigned.ipa $RUNNER_TEMP/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NXLightning-IPA
          path: ${{ runner.temp }}/NXLightning-unsigned.ipa
